name: Validate Kubernetes Platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests and release packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Validate platform
        env:
          YAML_PYTHON: python
        run: bash scripts/validate-platform.sh

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: progressive-delivery-dev
  namespace: argocd
spec:
  project: kubeforge-progressive
  source:
    repoURL: https://github.com/Waititu/kubeforge-platform.git
    targetRevision: main
    path: platform/gitops/kustomize/progressive-delivery/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeforge-progressive-lab
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true

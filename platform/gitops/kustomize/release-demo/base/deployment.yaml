apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
  labels:
    app.kubernetes.io/name: release-demo
    app.kubernetes.io/part-of: kubeforge-gitops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: release-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-demo
        app.kubernetes.io/part-of: kubeforge-gitops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              printf 'KubeForge Kustomize release: %s\n' "$RELEASE_VERSION" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: RELEASE_VERSION
              value: v1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: web-content
              mountPath: /www
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web-content
          emptyDir: {}

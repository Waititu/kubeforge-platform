apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: progressive-canary
  labels:
    app.kubernetes.io/part-of: kubeforge-progressive-delivery
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: progressive-canary
  template:
    metadata:
      labels:
        app: progressive-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /www
              printf 'KubeForge canary release: %s\n' "$RELEASE_VERSION" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: RELEASE_VERSION
              value: "v1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-content
              mountPath: /www
      volumes:
        - name: web-content
          emptyDir: {}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 100

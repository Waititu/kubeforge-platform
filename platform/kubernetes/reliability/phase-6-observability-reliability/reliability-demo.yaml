apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-demo
  namespace: kubeforge-reliability-lab
  labels:
    app.kubernetes.io/name: reliability-demo
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: reliability-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliability-demo
        app.kubernetes.io/part-of: kubeforge-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              touch /work/ready /work/live
              while true; do sleep 3600; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /work/ready"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /work/ready"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /work/live"]
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}

apiVersion: v1
kind: Service
metadata:
  name: storage-demo
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: storage-demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: storage-demo
  ports:
    - name: placeholder
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: storage-demo
spec:
  serviceName: storage-demo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-demo
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-demo
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

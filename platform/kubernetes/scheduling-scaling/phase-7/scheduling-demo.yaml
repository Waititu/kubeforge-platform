apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-demo
  namespace: kubeforge-scheduling-lab
  labels:
    app.kubernetes.io/name: scheduling-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduling-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduling-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker-1
                      - k8s-worker-2
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: scheduling-demo
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scheduling-demo
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /www
              echo "KubeForge scheduling demo: $(hostname)" > /www/index.html
              exec httpd -f -p 8080 -h /www
          volumeMounts:
            - name: web-content
              mountPath: /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: web-content
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling-demo
  namespace: kubeforge-scheduling-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduling-demo
  ports:
    - name: http
      port: 80
      targetPort: http

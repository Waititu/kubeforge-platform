apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dr-primary
  namespace: kubeforge-dr-lab
  labels:
    app.kubernetes.io/part-of: kubeforge
    kubeforge.io/phase: "10"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dr-backup
  namespace: kubeforge-dr-lab
  labels:
    app.kubernetes.io/part-of: kubeforge
    kubeforge.io/phase: "10"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi

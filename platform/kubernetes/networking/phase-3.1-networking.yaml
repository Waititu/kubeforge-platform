apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-echo
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: network-echo
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: network-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-echo
        app.kubernetes.io/part-of: kubeforge-platform
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: network-echo
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: network-echo
  namespace: kubeforge
  labels:
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: network-echo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-client
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: network-client
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-client
        app.kubernetes.io/part-of: kubeforge-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - sleep 36000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: network-route-backend-content
  namespace: kubeforge
  labels:
    app.kubernetes.io/part-of: kubeforge-platform
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files /index.html =404;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>KubeForge Route Backend</title></head>
      <body>
        <h1>KubeForge Phase 03.3</h1>
        <p>PATH_ROUTE_BACKEND_OK</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-route-backend
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: network-route-backend
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: network-route-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-route-backend
        app.kubernetes.io/part-of: kubeforge-platform
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: network-route-backend
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: page
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: network-route-backend-content
---
apiVersion: v1
kind: Service
metadata:
  name: network-route-backend
  namespace: kubeforge
  labels:
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: network-route-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Add a specific ingress-controller allowance without weakening
# the existing network-echo-ingress-allow-client policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-echo-ingress-allow-traefik
  namespace: kubeforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network-echo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-route-backend-ingress-allow-traefik
  namespace: kubeforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network-route-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080

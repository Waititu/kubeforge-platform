# Pinned with Helm chart version 41.4.0.
# Do not make Traefik the cluster-wide default IngressClass.
deployment:
  kind: Deployment
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: false

service:
  enabled: true
  spec:
    type: NodePort

ports:
  traefik:
    expose:
      default: false
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    nodePort: 30443

ingressRoute:
  dashboard:
    enabled: false


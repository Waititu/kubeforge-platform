apiVersion: v1
kind: Pod
metadata:
  name: network-client-cross-node
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: network-client
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  containers:
    - name: client
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: network-denied-probe
  namespace: kubeforge
  labels:
    app.kubernetes.io/name: network-denied-probe
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-control-plane
  tolerations:
    - operator: Exists
  containers:
    - name: probe
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

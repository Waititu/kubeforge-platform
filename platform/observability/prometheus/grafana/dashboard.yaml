apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: kubeforge-observability
data:
  kubeforge-overview.json: |
    {
      "uid": "kubeforge-overview",
      "title": "KubeForge Platform Overview",
      "tags": ["kubeforge", "ingress", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Ingress requests per second",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (host) (rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP 5xx responses per second",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (host, status) (rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m]))",
              "legendFormat": "{{host}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Ingress p95 request latency (seconds)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, host) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Scrape target health (1 = up)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "up",
              "legendFormat": "{{job}} / {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Argo Rollouts metrics endpoint health",
          "type": "stat",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "min(up{job=\"argo-rollouts\"})",
              "legendFormat": "Argo Rollouts",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {"min": 0, "max": 1},
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "id": 6,
          "title": "Active platform alerts",
          "type": "stat",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(ALERTS{alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "Firing alerts",
              "refId": "A"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        }
      ]
    }

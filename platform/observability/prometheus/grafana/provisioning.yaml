apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: kubeforge-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.kubeforge-observability.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: KubeForge
        orgId: 1
        folder: KubeForge
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards

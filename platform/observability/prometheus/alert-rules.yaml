apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: kubeforge-observability
  labels:
    app.kubernetes.io/part-of: kubeforge-platform
data:
  platform-alerts.yaml: |
    groups:
      - name: kubeforge-platform
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus scrape target is down"
              description: 'Target {{ $labels.job }} at {{ $labels.instance }} has been down for more than 2 minutes.'

          - alert: IngressHigh5xxRate
            expr: |
              (
                sum by (host) (
                  rate(nginx_ingress_controller_requests{status=~"5.."}[5m])
                )
                /
                clamp_min(
                  sum by (host) (
                    rate(nginx_ingress_controller_requests[5m])
                  ),
                  0.001
                )
              ) > 0.05
              and
              sum by (host) (
                rate(nginx_ingress_controller_requests[5m])
              ) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Elevated ingress HTTP 5xx rate"
              description: 'More than 5% of requests for {{ $labels.host }} are returning HTTP 5xx responses.'

          - alert: IngressHighP95Latency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, host) (
                  rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])
                )
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High ingress p95 request latency"
              description: 'The 95th percentile request latency for {{ $labels.host }} has exceeded 1 second for 5 minutes.'


          - alert: KubeForgeDeploymentUnavailable
            expr: |
              kube_deployment_spec_replicas{
                namespace=~"kubeforge|kubeforge-dr-lab|kubeforge-observability|nodegrid|multicloud-platform"
              }
              >
              kube_deployment_status_replicas_available{
                namespace=~"kubeforge|kubeforge-dr-lab|kubeforge-observability|nodegrid|multicloud-platform"
              }
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes deployment has unavailable replicas"
              description: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired.'

          - alert: KubeForgeContainerRestarting
            expr: |
              increase(
                kube_pod_container_status_restarts_total{
                  namespace=~"kubeforge|kubeforge-dr-lab|kubeforge-observability|nodegrid|multicloud-platform"
                }[10m]
              ) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Container restarted in a monitored namespace"
              description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted during the last 10 minutes.'

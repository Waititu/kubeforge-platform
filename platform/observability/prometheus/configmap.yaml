apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kubeforge-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: argo-rollouts
        static_configs:
          - targets:
              - argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.kubeforge-observability.svc.cluster.local:8080

      - job_name: ingress-nginx
        metrics_path: /metrics
        static_configs:
          - targets:
              - ingress-nginx-metrics.ingress-nginx.svc.cluster.local:10254

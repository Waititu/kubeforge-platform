apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kubeforge-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kubeforge-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web

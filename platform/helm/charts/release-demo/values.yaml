replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: busybox
  tag: "1.36.1"
  pullPolicy: IfNotPresent

releaseVersion: v1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

rollout:
  maxSurge: 1
  maxUnavailable: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 32Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 15
  readiness:
    periodSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
